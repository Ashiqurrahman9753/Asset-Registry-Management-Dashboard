name: Build & release desktop app

# Push a version tag (e.g. v1.1.0) once you're satisfied with what you've
# tested — this builds the Windows installer on a real Windows runner and
# publishes it as a GitHub Release. Every already-installed copy of the app
# checks this release channel and updates itself; no manual step on the
# client's end.
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dashboard dependencies
        run: npm install
        working-directory: dashboard

      - name: Install server dependencies
        run: npm install --omit=dev
        working-directory: server

      - name: Install electron dependencies
        run: npm install
        working-directory: electron

      # electron-builder has a known race condition: when the GitHub release
      # for this tag doesn't exist yet, it tries to create it while uploading
      # several files in parallel, and the create can lose that race for some
      # of them — they fail to upload with no non-zero exit code to show for
      # it (confirmed: v1.0.1's installer itself silently failed to upload
      # this way, leaving only the small .blockmap file on the release).
      # Creating the release first means electron-builder always hits the
      # reliable "upload to an existing release" path instead.
      - name: Ensure the GitHub release exists before uploading to it
        shell: bash
        run: |
          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish
        run: npm run release
        working-directory: electron
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Belt and braces: don't rely on any tool's draft-vs-published default
      # (electron-builder's own release-creation path published correctly
      # here before; gh release create's did not) — force it explicitly
      # every time, after the build has actually uploaded the real assets.
      - name: Ensure the release is published, not left as a draft
        shell: bash
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
